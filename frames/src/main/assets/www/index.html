<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>body{padding-inline:6px!important}</style></head><body><title>Frame Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Anton&family=Bebas+Neue&family=Inter+Tight:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700&family=Caveat:wght@400;700&family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: a studio workspace — top bar, tools on the left, canvas centre, properties right, layer × frame timeline along the bottom. Dark-first like pro animation software. */
:root {
  --bg: #16171b; --panel: #1f2026; --panel-2: #26272e; --ink: #e8e9ee; --muted: #9a9ca8; --rule: #33353e;
  --accent: #4d8dff; --accent-ink: #ffffff; --accent-soft: rgba(77,141,255,.16); --warn: #f5a524;
  --pasteboard: #2a2c33; --row-active: #2a3350; --row-alt: #1c1d23; --cell: #292a31; --cell-5: #30323a;
  --key-bg: #3a3d47; --hold: #555866; --tween: rgba(160,110,255,.45); --clip: #2f7a64; --clip-audio: #7a5a2f;
  --font-ui: "Hanken Grotesk", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 8px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eceef2; --panel: #ffffff; --panel-2: #f3f4f7; --ink: #17181c; --muted: #5f6370; --rule: #d9dce3;
    --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: rgba(37,99,235,.12); --warn: #b45309;
    --pasteboard: #d7dae1; --row-active: #dfe8ff; --row-alt: #f7f8fa; --cell: #eceef2; --cell-5: #e2e5eb;
    --key-bg: #d3d7e0; --hold: #9ca1ae; --tween: rgba(124,58,237,.28); --clip: #2f8f73; --clip-audio: #b7791f;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eceef2; --panel: #ffffff; --panel-2: #f3f4f7; --ink: #17181c; --muted: #5f6370; --rule: #d9dce3;
  --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: rgba(37,99,235,.12); --warn: #b45309;
  --pasteboard: #d7dae1; --row-active: #dfe8ff; --row-alt: #f7f8fa; --cell: #eceef2; --cell-5: #e2e5eb;
  --key-bg: #d3d7e0; --hold: #9ca1ae; --tween: rgba(124,58,237,.28); --clip: #2f8f73; --clip-audio: #b7791f;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font-ui); padding-inline: 16px; padding-block: 8px; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.app { height: 100%; display: flex; flex-direction: column; gap: 8px; }
.app > .work { flex: 1 1 auto; }
.app > .top, .app > .restore, .app > .timeline { flex: 0 0 auto; }

/* top bar */
.top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: 6px 8px; }
.brand { font-weight: 800; letter-spacing: -.01em; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 22px; height: 22px; }
.docname { color: var(--muted); font-size: 13px; max-width: 26ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { flex: 1 1 auto; }
.btn { border: 1px solid var(--rule); background: var(--panel-2); color: var(--ink); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.btn.tiny { padding: 3px 7px; font-size: 12px; }
.btn.icon { padding: 5px 7px; line-height: 0; }
.btn.icon svg { width: 18px; height: 18px; }
.save-state { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
.restore { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--r); padding: 6px 10px; font-size: 13px; }

/* workspace */
.work { display: grid; grid-template-columns: 48px minmax(0, 1fr) 300px; gap: 8px; min-height: 0; }
.toolbar { display: flex; flex-direction: column; gap: 3px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: 4px; overflow-y: auto; scrollbar-width: none; }
.tool { width: 38px; height: 36px; flex: 0 0 auto; border: 0; border-radius: 6px; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.tool svg { width: 21px; height: 21px; }
.tool:hover { background: var(--panel-2); }
.tool.on { background: var(--accent); color: var(--accent-ink); }
.tool.symbtn { margin-top: 6px; border-top: 1px solid var(--rule); border-radius: 0 0 6px 6px; }
.tool.symbtn.active { color: var(--accent); background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--accent); border-radius: 6px; }
.swatches { position: relative; width: 38px; height: 40px; flex: 0 0 auto; margin-top: 6px; cursor: pointer; }
.sw { position: absolute; width: 24px; height: 24px; border-radius: 4px; }
.sw.fill { left: 2px; top: 2px; border: 1px solid var(--rule); z-index: 2; }
.sw.stroke { right: 2px; bottom: 2px; border: 5px solid transparent; box-shadow: 0 0 0 1px var(--rule); }
.canvasWrap { position: relative; min-width: 0; min-height: 0; border-radius: var(--r); overflow: hidden; border: 1px solid var(--rule); background: var(--pasteboard); touch-action: none; }
#stage { display: block; width: 100%; height: 100%; touch-action: none; }
.dropHint { display: none; position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: var(--r); place-items: center; font-weight: 700; background: var(--accent-soft); pointer-events: none; }
body.dropping .dropHint { display: grid; }
.textEditor { position: absolute; z-index: 5; background: var(--panel); border: 1px solid var(--accent); border-radius: var(--r); padding: 6px; display: flex; flex-direction: column; gap: 6px; width: 250px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
.textEditor textarea { width: 100%; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 6px; padding: 6px; resize: vertical; }
.textEditor div { display: flex; gap: 6px; justify-content: flex-end; }

/* properties */
.props { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); overflow-y: auto; min-height: 0; }
.props-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.props-head strong { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
#propsClose { display: none; }
.psec { padding: 10px 12px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 7px; }
.psec h3 { margin: 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 8px; font-size: 13px; }
.brushgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.brushtile { display: flex; flex-direction: column; align-items: stretch; gap: 1px; padding: 4px 4px 3px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel-2); color: var(--ink); font: inherit; font-size: 11px; cursor: pointer; }
.brushtile canvas { width: 100%; height: 34px; background: #fff; border-radius: 3px; }
.brushtile.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.brushtile span { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.slider { grid-template-columns: 96px minmax(0, 1fr) 50px; }
.row.color { grid-template-columns: 96px 38px minmax(0, 1fr) auto; }
.row.two { grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); }
.row output { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.row input[type=number], .row select, .row input:not([type]), .row input[type=text] { width: 100%; min-width: 0; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 6px; padding: 5px 7px; }
input[type=range] { width: 100%; min-width: 0; accent-color: var(--accent); }
input[type=color] { width: 38px; height: 28px; padding: 0; border: 1px solid var(--rule); border-radius: 6px; background: none; cursor: pointer; }
.check { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 5px; }
.btnrow .btn { flex: 1 1 auto; }
.palette { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.chip { aspect-ratio: 1; border-radius: 4px; border: 1px solid var(--rule); cursor: pointer; padding: 0; }
.hint { margin: 0; font-size: 12px; color: var(--muted); }
.warn { margin: 0; font-size: 12px; color: var(--warn); }
.mono { font-family: var(--font-mono); }

/* timeline */
.timeline { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; height: 210px; }
.tl-controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
.tl-controls .group { display: flex; gap: 3px; align-items: center; }
.tl-controls .sep { width: 1px; height: 22px; background: var(--rule); margin: 0 3px; }
.tl-controls label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.tl-controls input[type=number] { width: 58px; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 5px; font-family: var(--font-mono); font-size: 12px; }
.tl-controls select { background: var(--panel-2); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 5px; font-size: 12px; max-width: 140px; }
.tl-controls .readout { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 12ch; line-height: 1.2; }
.tl-controls .readout small { display: block; color: var(--muted); font-size: 10px; }
.play-btn { width: 34px; height: 30px; border-radius: 6px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; }
.play-btn svg { width: 16px; height: 16px; }
.tl-body { display: grid; grid-template-columns: 170px minmax(0, 1fr); flex: 1; min-height: 0; }
.tl-heads { overflow: hidden; border-right: 1px solid var(--rule); }
.tl-ruler-pad { height: 22px; font-size: 10px; letter-spacing: .1em; color: var(--muted); display: flex; align-items: center; padding-left: 8px; background: var(--panel-2); }
.tl-head { height: 30px; display: flex; align-items: center; gap: 2px; padding: 0 4px; cursor: pointer; font-size: 13px; }
.tl-head.active { background: var(--row-active); }
.tl-head .ico { width: 24px; height: 24px; border: 0; background: transparent; color: var(--muted); padding: 3px; border-radius: 4px; cursor: pointer; line-height: 0; }
.tl-head .ico svg { width: 16px; height: 16px; }
.tl-head .ico:hover { color: var(--ink); background: var(--panel-2); }
.tl-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.tl-rename { width: 100%; background: var(--panel-2); border: 1px solid var(--accent); border-radius: 4px; padding: 2px 4px; }
.tl-scroll { overflow: auto; position: relative; min-width: 0; }
#tlSpacer { position: relative; min-height: 100%; }
#tlCanvas { position: sticky; left: 0; top: 0; display: block; touch-action: pan-x pan-y; }

/* popups & dialogs */
.popup { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); padding: 4px; min-width: 200px; box-shadow: 0 10px 30px rgba(0,0,0,.35); display: flex; flex-direction: column; }
.popup button { text-align: left; background: transparent; border: 0; padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; }
.popup button:hover { background: var(--accent-soft); }
.popup hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; width: 100%; }
dialog.dlg { background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 12px; padding: 0; width: min(460px, calc(100% - 32px)); max-height: calc(100% - 32px); display: flex; flex-direction: column; }
dialog.dlg:not([open]) { display: none; }
dialog.dlg.wide { width: min(620px, calc(100% - 32px)); }
dialog.dlg.small { padding: 16px; gap: 10px; }
dialog.dlg::backdrop { background: rgba(0,0,0,.55); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.dlg-head h2, dialog.dlg h2 { margin: 0; font-size: 16px; }
.dlg-body { padding: 4px 4px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.dlg-body > div > h3 { margin: 10px 12px 2px; font-size: 13px; }
.dlg-body > div > .row, .dlg-body > div > .check, .dlg-body > div > .hint, .dlg-body > div > .warn { margin: 4px 12px; }
.dlg-body img, .dlg-body video { max-width: 100%; max-height: 50vh; display: block; margin: 8px auto; background: #000; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--rule); }
.dlg-actions:empty { display: none; }
.progress { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.progress .bar { height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }
.export .summary { margin: 10px 12px 4px; padding: 10px; border-radius: var(--r); background: var(--accent-soft); font-size: 12px; line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip-btn { border: 1px solid var(--rule); background: var(--panel-2); border-radius: 999px; padding: 3px 9px; font-size: 12px; font-family: var(--font-mono); cursor: pointer; }
.chip-btn:hover { border-color: var(--accent); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 16px; padding: 8px 12px; }
table.keys { border-collapse: collapse; font-size: 12px; }
table.keys td { padding: 3px 6px 3px 0; vertical-align: top; }
kbd { font-family: var(--font-mono); font-size: 11px; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: var(--r); font-size: 13px; z-index: 100; max-width: calc(100% - 32px); }

/* phones & small tablets */
@media (max-width: 900px) {
  body { padding-block: 6px; }
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .toolbar { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
  .swatches { margin-top: 0; margin-left: 6px; }
  .tool.symbtn { margin-top: 0; margin-left: 6px; border-top: 0; border-left: 1px solid var(--rule); border-radius: 0 6px 6px 0; }
  .props { position: fixed; right: 16px; top: 60px; bottom: 16px; width: min(330px, calc(100% - 32px)); z-index: 30; box-shadow: 0 10px 40px rgba(0,0,0,.45); display: none; }
  body.props-open .props { display: block; }
  #propsClose { display: inline-block; }
  .timeline { height: 200px; }
  .tl-controls { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tl-controls > * { flex: 0 0 auto; }
  .tl-body { grid-template-columns: 116px minmax(0, 1fr); }
  .docname, .save-state, .hide-sm { display: none; }
}
@media (min-width: 901px) { #propsToggle { display: none; } }
@media (prefers-reduced-motion: reduce) { .progress .bar { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <span class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M7 5v4M12 5v4M17 5v4"/><circle cx="12" cy="14" r="2.5" fill="currentColor"/></svg>Frame Studio</span>
    <span class="docname" id="docName"></span>
    <button class="btn" id="fileBtn" type="button">File</button>
    <button class="btn icon" id="undoBtn" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5L4 10l5 5"/><path d="M4 10h10a6 6 0 010 12h-3"/></svg></button>
    <button class="btn icon" id="redoBtn" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l5 5-5 5"/><path d="M20 10H10a6 6 0 000 12h3"/></svg></button>
    <span class="spacer"></span>
    <span class="save-state" id="saveState"></span>
    <div class="btn-group" style="display:flex;gap:3px">
      <button class="btn" id="zoomMinus" type="button" aria-label="Zoom out">−</button>
      <button class="btn mono" id="zoomOut" type="button" title="Fit to screen">100%</button>
      <button class="btn" id="zoomPlus" type="button" aria-label="Zoom in">+</button>
    </div>
    <button class="btn hide-sm" id="settingsBtn" type="button">Settings</button>
    <button class="btn" id="propsToggle" type="button">Properties</button>
    <button class="btn" id="importBtn" type="button">Import</button>
    <button class="btn primary" id="exportBtn" type="button">Export</button>
  </header>

  <div class="restore" id="restoreBar" hidden>
    <span>Pick up where you left off with <strong id="restoreName"></strong>?</span>
    <button class="btn primary" id="restoreYes" type="button">Restore</button>
    <button class="btn" id="restoreNo" type="button">Not now</button>
  </div>

  <div class="work">
    <nav class="toolbar" id="toolbar" aria-label="Tools"></nav>
    <main class="canvasWrap" id="canvasWrap">
      <canvas id="stage" aria-label="Drawing canvas"></canvas>
      <div class="textEditor" id="textEditor" hidden>
        <textarea id="textInput" rows="3" placeholder="Type your text" aria-label="Text"></textarea>
        <div><button class="btn tiny" id="textCancel" type="button">Cancel</button><button class="btn tiny primary" id="textOk" type="button">Done (Ctrl+Enter)</button></div>
      </div>
      <div class="dropHint">Drop images, videos, GIFs, sounds or a project to import</div>
    </main>
    <aside class="props" id="props" aria-label="Properties">
      <div class="props-head"><strong>Properties</strong><button class="btn tiny" id="propsClose" type="button" aria-label="Close properties">✕</button></div>
      <div id="propsBody"></div>
    </aside>
  </div>

  <section class="timeline" aria-label="Timeline">
    <div class="tl-controls">
      <div class="group">
        <button class="btn icon" id="firstBtn" type="button" aria-label="First frame"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5L9 12l10 7z" fill="currentColor"/></svg></button>
        <button class="btn icon" id="prevBtn" type="button" aria-label="Previous frame (,)"><svg viewBox="0 0 24 24"><path d="M16 5L6 12l10 7z" fill="currentColor"/></svg></button>
        <button class="play-btn" id="playBtn" type="button" aria-label="Play / stop (Enter)"></button>
        <button class="btn icon" id="nextBtn" type="button" aria-label="Next frame (.)"><svg viewBox="0 0 24 24"><path d="M8 5l10 7-10 7z" fill="currentColor"/></svg></button>
        <button class="btn icon" id="lastBtn" type="button" aria-label="Last frame"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l10 7-10 7z" fill="currentColor"/></svg></button>
      </div>
      <div class="readout"><span id="frameNo">1 / 24</span><small id="frameTime"></small></div>
      <span class="sep"></span>
      <label>FPS <input type="number" id="fpsIn" min="1" max="60"></label>
      <label>Speed <select id="speedSel"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1">1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option></select></label>
      <label>Frames <input type="number" id="lenIn" min="1" max="7200"></label>
      <button class="btn tiny" id="loopBtn" type="button" title="Loop playback">Loop</button>
      <button class="btn tiny" id="pingBtn" type="button" title="Play forward then backward">Ping-pong</button>
      <div class="group"><button class="btn tiny" id="onionBtn" type="button" title="Onion skin: see neighbouring frames">Onion</button><button class="btn tiny" id="onionMore" type="button" aria-label="Onion skin options">▾</button></div>
      <span class="sep"></span>
      <button class="btn tiny" id="keyBtn" type="button" title="New blank key on the next frame (F6)">+ Blank key</button>
      <button class="btn tiny" id="dupBtn" type="button" title="Copy this drawing to the next frame (F7)">+ Copy key</button>
      <button class="btn tiny" id="holdBtn" type="button" title="Hold this drawing one frame longer (F5)">+ Hold</button>
      <button class="btn tiny" id="delFrameBtn" type="button" title="Delete this frame">− Frame</button>

      <label>Timing <select id="exposureSel"><option value="">Hold…</option><option value="1">This key on ones</option><option value="2">This key on twos</option><option value="3">This key on threes</option><option value="4">This key 4 frames</option><option value="all1">All keys on ones</option><option value="all2">All keys on twos</option><option value="all3">All keys on threes</option></select></label>
      <span class="readout"><small id="exposureOut"></small></span>

    </div>
  </section>
</div>

<script>
(() => {
// ============================================================================
// core.js — document model, matrices, colours, history, autosave
// ============================================================================
"use strict";
const App = (window.App = {});
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
let _uid = Date.now() % 1e9;
const uid = () => "o" + (++_uid).toString(36);

// ---------------------------------------------------------------- matrices [a b c d e f]
const M = {
  id: () => [1, 0, 0, 1, 0, 0],
  mul: (m, n) => [
    m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1],
    m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
    m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]
  ],
  inv: (m) => {
    const d = m[0] * m[3] - m[1] * m[2] || 1e-9;
    return [m[3] / d, -m[1] / d, -m[2] / d, m[0] / d, (m[2] * m[5] - m[3] * m[4]) / d, (m[1] * m[4] - m[0] * m[5]) / d];
  },
  apply: (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]],
  translate: (x, y) => [1, 0, 0, 1, x, y],
  scale: (sx, sy, cx = 0, cy = 0) => [sx, 0, 0, sy, cx - sx * cx, cy - sy * cy],
  rotate: (a, cx = 0, cy = 0) => {
    const c = Math.cos(a), s = Math.sin(a);
    return [c, s, -s, c, cx - c * cx + s * cy, cy - s * cx - c * cy];
  },
  // translate / rotate / scale / skew decomposition, used for tweening
  decompose: (m) => {
    const sx = Math.hypot(m[0], m[1]);
    const rot = Math.atan2(m[1], m[0]);
    const det = m[0] * m[3] - m[1] * m[2];
    const sy = det / (sx || 1e-9);
    const skew = Math.atan2(m[0] * m[2] + m[1] * m[3], sx * sx);
    return { tx: m[4], ty: m[5], rot, sx, sy, skew };
  },
  compose: (d) => {
    const c = Math.cos(d.rot), s = Math.sin(d.rot);
    const k = Math.tan(d.skew || 0);
    // R * [sx, sx*k; 0, sy]
    return [c * d.sx, s * d.sx, c * d.sx * k - s * d.sy, s * d.sx * k + c * d.sy, d.tx, d.ty];
  },
  scaleFactor: (m) => Math.sqrt(Math.abs(m[0] * m[3] - m[1] * m[2])) || 1
};

// ---------------------------------------------------------------- colours
const Color = {
  parse(c) {
    if (!c) return null;
    if (c[0] === "#") {
      let h = c.slice(1);
      if (h.length === 3) h = h.split("").map((x) => x + x).join("");
      const n = parseInt(h.slice(0, 6), 16);
      const a = h.length === 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1;
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255, a];
    }
    const m = c.match(/rgba?\(([^)]+)\)/);
    if (m) { const p = m[1].split(",").map(Number); return [p[0], p[1], p[2], p[3] ?? 1]; }
    return [0, 0, 0, 1];
  },
  str(r, g, b, a = 1) { return `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${+a.toFixed(3)})`; },
  hex(c) { const p = Color.parse(c) || [0, 0, 0, 1]; return "#" + p.slice(0, 3).map((v) => Math.round(v).toString(16).padStart(2, "0")).join(""); },
  alpha(c) { const p = Color.parse(c); return p ? p[3] : 1; },
  withAlpha(c, a) { const p = Color.parse(c) || [0, 0, 0, 1]; return Color.str(p[0], p[1], p[2], a); },
  mix(a, b, t) {
    const p = Color.parse(a), q = Color.parse(b);
    if (!p || !q) return t < 0.5 ? a : b;
    return Color.str(lerp(p[0], q[0], t), lerp(p[1], q[1], t), lerp(p[2], q[2], t), lerp(p[3], q[3], t));
  }
};

// ---------------------------------------------------------------- document
function newDoc(w = 1080, h = 1080, fps = 12, frames = 24) {
  return {
    version: 1, name: "Untitled animation", width: w, height: h, fps, speed: 1, frames,
    background: "#ffffff", transparent: false, loop: true, pingpong: false,
    onion: { on: true, before: 1, after: 1, opacity: 0.35 },
    layers: [newDrawLayer("Layer 1", frames)]
  };
}
function newDrawLayer(name, frames) {
  const cells = new Array(frames).fill(null);
  cells[0] = newCell();
  return { id: uid(), name, kind: "draw", visible: true, locked: false, opacity: 1, blend: "source-over", cells };
}
const newCell = () => ({ key: true, objects: [], raster: null, tween: null });

App.doc = newDoc();
App.state = {
  frame: 0, layer: 0, tool: "brush", playing: false,
  selection: [],          // selected object ids (current cell)
  zoom: 1, panX: 0, panY: 0,
  autoKey: true,
  dirty: 0                // bumped on every change (render cache key)
};
App.style = {
  fill: "#1d4ed8", stroke: "#111827", strokeOn: false, sw: 6, opacity: 1, blend: "source-over",
  grad: null,             // {type:'linear'|'radial', c1, c2, angle}
  brush: { size: 18, pressure: 0.8, smooth: 0.5, taper: true, style: "pressure" },
  paint: { brush: "round", size: 24, hardness: 0.7, opacity: 1, flow: 1, mix: 0.35, pressureSize: true, pressureOpacity: false, color: "#111827" },
  eraser: { size: 40, mode: "all" },   // all | pixels | cut (parts of vectors) | objects (whole vectors)
  sym: { mode: "off", n: 6, cx: null, cy: null },   // off | x | y | xy | radial | kaleido; centre null = canvas centre
  repeat: { count: 3, dx: 40, dy: 0, rotate: 0, scale: 100, fade: 100, pivot: "selection" },
  shape: { radius: 0, points: 5, star: true, inner: 0.45, constrain: false },
  text: { font: "Anton", size: 120, weight: 700, italic: false, align: "left" },
  bucket: { tolerance: 24 }
};

/** Index of the key cell that frame f shows on layer L (or -1). */
function keyIndexAt(L, f) { for (let i = Math.min(f, L.cells.length - 1); i >= 0; i--) if (L.cells[i]) return i; return -1; }
function nextKeyIndex(L, k) { for (let i = k + 1; i < L.cells.length; i++) if (L.cells[i]) return i; return -1; }
const activeLayer = () => App.doc.layers[App.state.layer];

function changed(what) {
  App.state.dirty++;
  App.emit && App.emit("changed", what);
  Autosave.schedule();
}

// ---------------------------------------------------------------- cloning & history
function cloneObj(o) { return JSON.parse(JSON.stringify(o)); }
function cloneCanvas(c) {
  if (!c) return null;
  const n = document.createElement("canvas"); n.width = c.width; n.height = c.height;
  n.getContext("2d").drawImage(c, 0, 0); return n;
}
function snapshot() {
  const d = App.doc;
  return {
    meta: { width: d.width, height: d.height, fps: d.fps, speed: d.speed, frames: d.frames, background: d.background, transparent: d.transparent, loop: d.loop, pingpong: d.pingpong },
    layers: d.layers.map((L) => ({
      ...L,
      settings: L.settings ? { ...L.settings } : undefined,
      cells: L.cells ? L.cells.map((c) => (c ? { key: true, objects: c.objects.map(cloneObj), raster: c.raster, tween: c.tween } : null)) : undefined
    })),
    frame: App.state.frame, layer: App.state.layer
  };
}
function restore(s) {
  Object.assign(App.doc, s.meta);
  App.doc.layers = s.layers.map((L) => ({
    ...L,
    settings: L.settings ? { ...L.settings } : undefined,
    cells: L.cells ? L.cells.map((c) => (c ? { key: true, objects: c.objects.map(cloneObj), raster: c.raster, tween: c.tween } : null)) : undefined
  }));
  App.state.frame = clamp(s.frame, 0, App.doc.frames - 1);
  App.state.layer = clamp(s.layer, 0, App.doc.layers.length - 1);
  App.state.selection = [];
}
const History = {
  undo: [], redo: [],
  push() { this.undo.push(snapshot()); if (this.undo.length > 60) this.undo.shift(); this.redo = []; },
  doUndo() { if (!this.undo.length) return; this.redo.push(snapshot()); restore(this.undo.pop()); changed("history"); },
  doRedo() { if (!this.redo.length) return; this.undo.push(snapshot()); restore(this.redo.pop()); changed("history"); },
  clear() { this.undo = []; this.redo = []; }
};

/**
 * Returns the editable key cell for the active layer at the current frame.
 * With auto-key on, drawing on a held or tweened frame creates a new key that
 * starts from what is currently shown there.
 */
function editableCell(forRaster) {
  const L = activeLayer();
  if (!L || L.kind !== "draw") return null;
  const f = App.state.frame;
  if (L.cells[f]) return L.cells[f];
  const k = keyIndexAt(L, f);
  if (!App.state.autoKey && k >= 0) return L.cells[k];
  const cell = newCell();
  if (k >= 0) {
    const shown = Render.cellObjectsAt(L, f);
    cell.objects = shown.map(cloneObj);
    cell.raster = cloneCanvas(L.cells[k].raster);
    if (L.cells[k].tween) cell.tween = L.cells[k].tween;
  }
  L.cells[f] = cell;
  return cell;
}

/** Copy-on-write raster for painting (keeps history snapshots intact). */
function rasterForPaint(cell) {
  const d = App.doc;
  if (!cell.raster) { const c = document.createElement("canvas"); c.width = d.width; c.height = d.height; cell.raster = c; }
  else cell.raster = cloneCanvas(cell.raster);
  return cell.raster;
}

// ---------------------------------------------------------------- IndexedDB autosave (per browser convenience)
const Autosave = {
  timer: 0,
  schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => this.save(), 4000); },
  db() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open("frame-studio", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  async save() {
    try {
      const data = await Project.serialize({ embedMedia: true, asBlobs: true });
      const db = await this.db();
      await new Promise((res) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(data, "autosave"); t.oncomplete = res; t.onerror = res; t.onabort = res; });
      App.emit && App.emit("saved");
    } catch (e) { /* storage unavailable; ignore */ }
  },
  async load() {
    try {
      const db = await this.db();
      return await new Promise((res) => { const t = db.transaction("kv").objectStore("kv").get("autosave"); t.onsuccess = () => res(t.result || null); t.onerror = () => res(null); });
    } catch (e) { return null; }
  },
  async clear() {
    try { const db = await this.db(); db.transaction("kv", "readwrite").objectStore("kv").delete("autosave"); } catch (e) { /* ignore */ }
  }
};

// ---------------------------------------------------------------- tiny event bus
const listeners = {};
App.on = (ev, fn) => (listeners[ev] = listeners[ev] || []).push(fn);
App.emit = (ev, data) => (listeners[ev] || []).forEach((fn) => fn(data));

let toastTimer = 0;
function toast(msg, ms = 3200) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), ms);
}

// ============================================================================
// render.js — geometry for vector objects, tweening, and frame compositing
// ============================================================================
const Render = (App.Render = {});
const imgCache = new Map();
function imageFor(src) {
  let im = imgCache.get(src);
  if (!im) { im = new Image(); im.onload = () => changed("image"); im.src = src; imgCache.set(src, im); }
  return im;
}

// ---------------------------------------------------------------- local geometry
Render.localPath = function (o, p = new Path2D()) {
  switch (o.type) {
    case "rect": {
      const r = Math.min(o.r || 0, Math.abs(o.w) / 2, Math.abs(o.h) / 2);
      if (r > 0 && p.roundRect) p.roundRect(0, 0, o.w, o.h, r); else p.rect(0, 0, o.w, o.h);
      break;
    }
    case "ellipse": p.ellipse(o.w / 2, o.h / 2, Math.abs(o.w / 2), Math.abs(o.h / 2), 0, 0, Math.PI * 2); break;
    case "poly": {
      const n = o.star ? o.n * 2 : o.n;
      for (let i = 0; i < n; i++) {
        const r = o.star && i % 2 ? o.inner : 1, a = (Math.PI * 2 * i) / n - Math.PI / 2;
        const x = o.w / 2 + Math.cos(a) * r * o.w / 2, y = o.h / 2 + Math.sin(a) * r * o.h / 2;
        i ? p.lineTo(x, y) : p.moveTo(x, y);
      }
      p.closePath(); break;
    }
    case "path": {
      // a node with start: true begins a new sub-path (compound paths, e.g. a shape with holes)
      const N = o.nodes; if (!N.length) break;
      const seg = (a, b) => (a.ox === a.x && a.oy === a.y && b.ix === b.x && b.iy === b.y) ? p.lineTo(b.x, b.y) : p.bezierCurveTo(a.ox, a.oy, b.ix, b.iy, b.x, b.y);
      const closeSub = (a, b) => { if (o.closed && b > a) { seg(N[b], N[a]); p.closePath(); } };
      let s0 = 0;
      p.moveTo(N[0].x, N[0].y);
      for (let i = 1; i < N.length; i++) {
        if (N[i].start) { closeSub(s0, i - 1); s0 = i; p.moveTo(N[i].x, N[i].y); }
        else seg(N[i - 1], N[i]);
      }
      closeSub(s0, N.length - 1);
      break;
    }
    case "brush": brushOutline(o, p); break;
    case "rings":
      // polygons left after partial erasing: [[outer, hole, …], …], each ring a flat x,y list
      for (const poly of o.polys) for (const r of poly) {
        if (r.length < 6) continue;
        p.moveTo(r[0], r[1]);
        for (let i = 2; i < r.length; i += 2) p.lineTo(r[i], r[i + 1]);
        p.closePath();
      }
      break;
    case "image": p.rect(0, 0, o.w, o.h); break;
    case "text": { const b = textBox(o); p.rect(b.x, b.y, b.w, b.h); break; }
  }
  return p;
};

/** Vector brush styles (the brush object's `style`). */
Render.VBRUSHES = [
  ["pressure", "Pressure"], ["uniform", "Monoline"], ["taper", "Ink taper"], ["calligraphy", "Calligraphy"], ["rough", "Rough edge"],
  ["bristle", "Dry bristle"], ["dotted", "Dotted"], ["dashed", "Dashed"], ["spray", "Spray"], ["splatter", "Splatter"]
];
/** Repeatable pseudo-random number in 0..1 (brush textures must look the same on every redraw). */
function hash(n) { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); }

/** A filled ribbon through points a..b of xs/ys with half-widths rs, round at both ends. */
function ribbon(p, xs, ys, rs, a, b) {
  const n = b - a + 1;
  if (n < 1) return;
  if (n === 1) { p.moveTo(xs[a] + rs[a], ys[a]); p.arc(xs[a], ys[a], rs[a], 0, Math.PI * 2); return; }
  const lx = [], ly = [], rx = [], ry = [];
  for (let k = 0; k < n; k++) {
    const i = a + k, i0 = Math.max(a, i - 1), i1 = Math.min(b, i + 1);
    let tx = xs[i1] - xs[i0], ty = ys[i1] - ys[i0];
    const len = Math.hypot(tx, ty) || 1; tx /= len; ty /= len;
    const r = rs[i];
    lx[k] = xs[i] - ty * r; ly[k] = ys[i] + tx * r;
    rx[k] = xs[i] + ty * r; ry[k] = ys[i] - tx * r;
  }
  const e = n - 1;
  p.moveTo(lx[0], ly[0]);
  for (let k = 1; k < n - 1; k++) p.quadraticCurveTo(lx[k], ly[k], (lx[k] + lx[k + 1]) / 2, (ly[k] + ly[k + 1]) / 2);
  p.lineTo(lx[e], ly[e]);
  const ae = Math.atan2(ly[e] - ys[b], lx[e] - xs[b]);
  p.arc(xs[b], ys[b], rs[b], ae, ae - Math.PI, true);
  for (let k = n - 2; k >= 1; k--) p.quadraticCurveTo(rx[k], ry[k], (rx[k] + rx[k - 1]) / 2, (ry[k] + ry[k - 1]) / 2);
  p.lineTo(rx[0], ry[0]);
  const a0 = Math.atan2(ry[0] - ys[a], rx[0] - xs[a]);
  p.arc(xs[a], ys[a], rs[a], a0, a0 - Math.PI, true);
  p.closePath();
}
const dot = (p, x, y, r) => { p.moveTo(x + r, y); p.arc(x, y, r, 0, Math.PI * 2); };

/** Outline of a vector brush stroke (pts = x,y,pressure triplets) in the stroke's style. */
function brushOutline(o, p) {
  const pts = o.pts, n = pts.length / 3;
  if (!n) return;
  const st = o.style || "pressure", seed = o.seed || 1, size = o.size;
  const xs = new Array(n), ys = new Array(n), rs = new Array(n);
  for (let i = 0; i < n; i++) { xs[i] = pts[i * 3]; ys[i] = pts[i * 3 + 1]; }
  const tapered = (o.taper || st === "taper") && n > 6, tk = st === "taper" ? Math.max(4, Math.round(n / 3)) : 4, tmin = st === "taper" ? 0.06 : 0.35;
  for (let i = 0; i < n; i++) {
    let r = st === "uniform" ? size / 2 : (size * ((1 - o.pressure) + o.pressure * pts[i * 3 + 2])) / 2;
    if (tapered && st !== "uniform") { if (i < tk) r *= tmin + ((1 - tmin) * i) / tk; if (i > n - 1 - tk) r *= tmin + ((1 - tmin) * (n - 1 - i)) / tk; }
    if (st === "calligraphy") {
      // a flat nib held at 45°: thick across it, hairline along it
      const i0 = Math.max(0, i - 1), i1 = Math.min(n - 1, i + 1);
      let tx = xs[i1] - xs[i0], ty = ys[i1] - ys[i0]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
      r *= 0.1 + 0.9 * Math.abs(tx * Math.SQRT1_2 - ty * Math.SQRT1_2);
    }
    if (st === "rough") r *= 0.6 + 0.8 * hash(seed + i * 1.37);
    rs[i] = Math.max(0.3, r);
  }
  // running length along the stroke
  const L = new Float64Array(n);
  for (let i = 1; i < n; i++) L[i] = L[i - 1] + Math.hypot(xs[i] - xs[i - 1], ys[i] - ys[i - 1]);
  const at = (d) => { // point + index at distance d
    let i = 1; while (i < n - 1 && L[i] < d) i++;
    const seg = L[i] - L[i - 1] || 1, t = Math.min(1, Math.max(0, (d - L[i - 1]) / seg));
    return [xs[i - 1] + (xs[i] - xs[i - 1]) * t, ys[i - 1] + (ys[i] - ys[i - 1]) * t, rs[i - 1] + (rs[i] - rs[i - 1]) * t];
  };
  switch (st) {
    case "dotted": {
      const gap = Math.max(1, size * 1.6);
      for (let d = 0; d <= L[n - 1] + 1e-6; d += gap) { const [x, y, r] = at(d); dot(p, x, y, r * 0.8); }
      break;
    }
    case "dashed": {
      const dash = Math.max(2, size * 2.4), period = dash + Math.max(1, size * 1.4);
      let a = -1;
      for (let i = 0; i <= n; i++) {
        const on = i < n && L[i] % period < dash;
        if (on && a < 0) a = i;
        if (!on && a >= 0) { ribbon(p, xs, ys, rs, a, i - 1); a = -1; }
      }
      break;
    }
    case "spray": {
      const count = Math.max(3, Math.min(16, Math.round(size / 3)));
      for (let i = 0; i < n; i++) for (let k = 0; k < count; k++) {
        const h = seed * 13 + i * 31 + k * 7, ang = hash(h) * Math.PI * 2, dist = Math.sqrt(hash(h + 1)) * rs[i] * 1.8;
        dot(p, xs[i] + Math.cos(ang) * dist, ys[i] + Math.sin(ang) * dist, Math.max(0.5, size * 0.06 * (0.5 + hash(h + 2))));
      }
      break;
    }
    case "splatter": {
      for (let i = 0; i < n; i++) rs[i] *= 0.7;
      ribbon(p, xs, ys, rs, 0, n - 1);
      for (let i = 0; i < n; i++) {
        const h = seed * 17 + i * 23;
        if (hash(h) < 0.6) continue;
        const ang = hash(h + 1) * Math.PI * 2, dist = size * (0.6 + hash(h + 2) * 1.3);
        dot(p, xs[i] + Math.cos(ang) * dist, ys[i] + Math.sin(ang) * dist, Math.max(0.5, size * (0.05 + 0.14 * hash(h + 3))));
      }
      break;
    }

  Tools.get("pen").finish?.();

// ---------------------------------------------------------------- keyboard
UI.bindKeys = function () {
  window.addEventListener("keydown", (e) => {
    if (isTyping(e) || document.querySelector("dialog[open]")) {
      if (e.target && e.target.id === "textInput") { if (e.key === "Escape") TextTool.cancel(); if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) TextTool.commit(); }
      return;
    }
    const k = e.key, mod = e.ctrlKey || e.metaKey;
    if (mod && k.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? History.doRedo() : History.doUndo(); return; }
    if (mod && k.toLowerCase() === "y") { e.preventDefault(); History.doRedo(); return; }
    if (mod && k.toLowerCase() === "c") { Cmd.copy(); return; }
    if (mod && k.toLowerCase() === "v") { e.preventDefault(); Cmd.paste(true); return; }
    if (mod && k.toLowerCase() === "g") { e.preventDefault(); e.shiftKey ? Cmd.ungroup() : Cmd.group(); return; }
    if (mod && k.toLowerCase() === "m") { e.preventDefault(); Cmd.merge("unite"); return; }
    if (mod && e.shiftKey && k.toLowerCase() === "d") { e.preventDefault(); UI.repeatDialog(); return; }
    if (mod && k.toLowerCase() === "d") { e.preventDefault(); Cmd.duplicate(); return; }
    if (mod && k.toLowerCase() === "a") { e.preventDefault(); Cmd.selectAll(); return; }
    if (mod && k.toLowerCase() === "s") { e.preventDefault(); App.Exporter.saveProject(); return; }
    if (mod && k.toLowerCase() === "e") { e.preventDefault(); App.Exporter.open(); return; }
    if (k === "Enter") { e.preventDefault(); if (App.state.tool === "pen") Tools.get("pen").finish(); else Player.toggle(); return; }
    if (k === "Escape") { Tools.get("pen").finish(); App.state.selection = []; App.emit("selection"); View.redraw(); return; }
    if (k === "Delete" || k === "Backspace") { e.preventDefault(); if (App.state.tool === "direct" && Tools.get("direct").activeNode >= 0) Cmd.deleteNode(); else Cmd.delete(); return; }
    if (k.startsWith("Arrow")) { e.preventDefault(); const s = e.shiftKey ? 10 : 1; Cmd.nudge(k === "ArrowLeft" ? -s : k === "ArrowRight" ? s : 0, k === "ArrowUp" ? -s : k === "ArrowDown" ? s : 0); return; }
    if (k === "," || k === "<") { if (e.shiftKey) jumpKey(-1); else App.goto(App.state.frame - 1); return; }
    if (k === "." || k === ">") { if (e.shiftKey) jumpKey(1); else App.goto(App.state.frame + 1); return; }
    if (k === "F5") { e.preventDefault(); Frames.insertHold(); return; }
    if (k === "F6") { e.preventDefault(); Frames.blankKey(); return; }
    if (k === "F7") { e.preventDefault(); Frames.duplicateKey(); return; }
    if (k === "+" || k === "=") { View.zoomAt(1.25); return; }
    if (k === "-") { View.zoomAt(0.8); return; }
    if (k === "0") { View.fit(); return; }
    const t = TOOLS.find((x) => x[2] === k.toLowerCase());
    if (t && !mod) App.setTool(t[0]);
  });
};
function jumpKey(dir) {
  const L = activeLayer(); if (!L || !L.cells) return;
  let f = App.state.frame + dir;
  while (f >= 0 && f < L.cells.length && !L.cells[f]) f += dir;
  if (f >= 0 && f < L.cells.length) App.goto(f);
}

/** In the Android app: stream the file to the phone's storage through the native bridge. */
async function saveViaAndroid(filename, blob) {
  const bridge = window.AndroidBridge;
  const id = bridge.begin(filename, blob.type || "application/octet-stream");
  if (!id) throw new Error("Couldn't create the file on this phone.");
  const CH = 768 * 1024;
  for (let o = 0; o < blob.size; o += CH) {
    const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = rej; r.readAsDataURL(blob.slice(o, o + CH)); });
    if (!bridge.append(id, b64)) throw new Error("Writing the file failed.");
  }
  const where = bridge.finish(id);
  if (!where) throw new Error("Saving failed.");
  const [uri, folder] = where.split("|");
  UI.dialog("Saved", h("div", {}, h("p", { class: "hint", style: "margin:12px" }, `${filename} (${(blob.size / 1e6).toFixed(2)} MB) is in ${folder} on your phone.`)), [
    btn("Share…", () => bridge.share(uri, blob.type || "application/octet-stream")),
    btn("Done", (e) => e.target.closest("dialog").close(), "primary")
  ]);
}
async function offer(filename, blob) {
  if (window.AndroidBridge) { try { await saveViaAndroid(filename, blob); } catch (e) { toast(e.message || "Saving failed."); } return; }
  if (downloads) {
    try { await downloads.save({ filename, data: blob }); toast("Saved " + filename); return; }
    catch (e) {
      if (e && e.code === "declined") { toast("Download cancelled."); return; }
      if (e && e.code === "rate_limited") { toast("A save prompt is already open."); return; }
      if (e && e.code === "too_large") { toast("That file is too large for this save method. Try a smaller size or fewer frames."); return; }
    }
  }
  const url = URL.createObjectURL(blob), type = blob.type;
  const media = type.startsWith("video/") ? h("video", { src: url, controls: true, loop: true, playsinline: true }) : type.startsWith("image/") ? h("img", { src: url, alt: filename }) : null;
  UI.dialog("Your file", h("div", {}, h("p", { class: "hint" }, `${filename} · ${(blob.size / 1e6).toFixed(2)} MB. Downloads aren't available in this view: right-click the preview and choose Save, or open this page in Chrome or Safari.`), media), []);
}

Exporter.run = async function (o) {
  Player.stop(); TextTool.commit();
  const ext = { mp4: "mp4", webm: "webm", gif: "gif", png: "zip", sprite: o.spriteJson ? "zip" : "png", svg: "svg", frame: "png" }[o.format];

  try {
    let blob;
    if (o.format === "frame") {
      const c = document.createElement("canvas"); c.width = Math.round(o.width); c.height = Math.round(o.height);
      if (hasVideo()) await Media.prepareFrame(App.state.frame);
      renderInto(c.getContext("2d"), c.width, c.height, App.state.frame, o);
      blob = await new Promise((r) => c.toBlob(r, "image/png"));
    } else {
      const plan = framePlan(o);

      else if (o.format === "gif") blob = await exportGif(o, plan, prog);
      else if (o.format === "png") blob = await exportPngZip(o, plan, prog);

  }
};

  App.on("frame", () => { if (!App.state.playing) UI.buildPropsSoon(); });
  App.on("changed", (w) => { $("undoBtn").disabled = !History.undo.length; $("redoBtn").disabled = !History.redo.length; if (["history", "load", "layers", "frames", "import", "rotoscope", "new"].includes(w)) { UI.buildPropsSoon(); UI.syncTimelineControls(); $("docName").textContent = App.doc.name; } });
  App.on("zoom", () => { $("zoomOut").textContent = Math.round(App.state.zoom * 100) + "%"; });
  App.on("saved", () => { $("saveState").textContent = "Saved in this browser"; });
  let t = 0; UI.buildPropsSoon = () => { clearTimeout(t); t = setTimeout(() => UI.buildProps(), 60); };

  $("fileBtn").onclick = fileMenu;
  $("undoBtn").onclick = () => History.doUndo();
  $("redoBtn").onclick = () => History.doRedo();
  $("importBtn").onclick = () => $("importFile").click();
  $("exportBtn").onclick = () => Exporter.open();
  $("settingsBtn").onclick = () => UI.docSettings();
  $("zoomOut").onclick = () => View.fit();
  $("zoomMinus").onclick = () => View.zoomAt(0.8);
  $("zoomPlus").onclick = () => View.zoomAt(1.25);
  $("propsToggle").onclick = () => document.body.classList.toggle("props-open");
  $("propsClose").onclick = () => UI.closeProps();
  $("importFile").onchange = (e) => { UI.importFiles(e.target.files || []); e.target.value = ""; };
  $("projectFile").onchange = async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
    const prog = UI.progress("Opening project…");
    try { await Project.load(JSON.parse(await f.text())); View.fit(); UI.refreshAll(); toast("Project opened."); } catch (err) { toast(err.message || "Couldn't open that file."); }
    prog.close();
  };
  $("textOk").onclick = () => TextTool.commit();
  $("textCancel").onclick = () => TextTool.cancel();
  // drop files anywhere
  document.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dropping"); });
  document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("dropping"); });
  document.addEventListener("drop", (e) => { e.preventDefault(); document.body.classList.remove("dropping"); if (e.dataTransfer.files.length) UI.importFiles(e.dataTransfer.files); });
  window.addEventListener("paste", (e) => { const files = [...(e.clipboardData?.files || [])]; if (files.length) UI.importFiles(files); });

  UI.refreshAll();
  App.setTool("select");
  App.state.selection = [];
  // offer to bring back the last session
  const saved = await Autosave.load();
  if (saved && saved.doc) {
    const bar = $("restoreBar"); bar.hidden = false;
    $("restoreName").textContent = saved.doc.name || "your animation";
    $("restoreYes").onclick = async () => { bar.hidden = true; const p = UI.progress("Restoring…"); try { await Project.load(saved); View.fit(); UI.refreshAll(); } catch (e) { toast("Couldn't restore: " + e.message); } p.close(); };
    $("restoreNo").onclick = () => { bar.hidden = true; };
  }
  if (document.fonts) document.fonts.ready.then(() => changed("fonts"));
}
start();

})();
</script>
</body></html>
