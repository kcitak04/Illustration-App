name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/CoverStudio.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/CoverStudio-debug.apk
          cp frames/build/outputs/apk/release/frames-release.apk out/FrameStudio.apk
          cp frames/build/outputs/apk/debug/frames-debug.apk out/FrameStudio-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: out/*.apk

      # Every push to main refreshes a "latest" release so the APK can be downloaded straight from a phone.
      - name: Publish "latest" release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cover Studio + Frame Studio (latest build)
          prerelease: true
          make_latest: true
          files: |
            out/CoverStudio.apk
            out/FrameStudio.apk
          body: |
            Latest builds from ${{ github.sha }}.
            - **CoverStudio.apk**: vector + photo editor for album covers.
            - **FrameStudio.apk**: animation studio (vector + paint tools, timeline, video import, MP4/GIF export).
            On your Android phone: download the APK, open it, and allow "Install unknown apps" for your browser when asked.
