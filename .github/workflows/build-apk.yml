name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/CoverStudio.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/CoverStudio-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CoverStudio-apk
          path: out/*.apk

      # Every push to main refreshes a "latest" release so the APK can be downloaded straight from a phone.
      - name: Publish "latest" release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cover Studio (latest build)
          prerelease: true
          make_latest: true
          files: out/CoverStudio.apk
          body: |
            Latest build of Cover Studio from ${{ github.sha }}.
            On your Android phone: download **CoverStudio.apk**, open it, and allow "Install unknown apps" for your browser when asked.
